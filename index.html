    <style>
      #startup-message {font: 15px/1.6 Arial,sans-serif;max-width:620px;margin:10vh auto;background:#f8f3e7;border:1px solid #dae8de;border-radius:18px;padding:28px;color:#164c40}
      #startup-message h1 {font-size:23px;margin:0 0 12px} #startup-message pre {white-space:pre-wrap;word-break:break-word;background:#fffefa;border:1px solid #e8ebe4;padding:12px;border-radius:10px;color:#9a2637}
    </style>
    <script>
      window.__emeraldStarted = false;
      window.__emeraldShowError = function(message) {
        if(window.__emeraldStarted) {console.error('Emerald Library runtime issue:',message);return;}
        var root=document.getElementById('root');if (!root) return;
        var box=document.getElementById('startup-message');
        if (!box) {root.innerHTML='<div id="startup-message" role="alert"><h1>Emerald Library — Startup problem</h1><p>The page could not start. Send a screenshot of the message below:</p><pre id="startup-detail"></pre></div>';}
        else if (!document.getElementById('startup-detail')) { box.innerHTML='<h1>Emerald Library — Startup problem</h1><p>Send a screenshot of the error below:</p><pre id="startup-detail"></pre>'; }
        var detail=document.getElementById('startup-detail');
        if (detail) detail.textContent=String(message || 'Unknown startup error');
      };
      window.addEventListener('error', function(e) {
        if (e.message) window.__emeraldShowError(e.message + (e.filename ? '\n' + e.filename + ':' + e.lineno : ''));
        else if (e.target && (e.target.tagName==='SCRIPT' || (e.target.tagName==='LINK' && e.target.rel==='stylesheet'))) window.__emeraldShowError('Failed to load asset: ' + (e.target.src || e.target.href));
      }, true);
      window.addEventListener('unhandledrejection',function(e){window.__emeraldShowError(e.reason?.stack || e.reason?.message || String(e.reason));});
      window.addEventListener('DOMContentLoaded',function(){
        setTimeout(function(){if(!window.__emeraldStarted && !document.getElementById('startup-detail')) window.__emeraldShowError('React did not render within 8 seconds. Open F12 → Console and send the red error message.');},8000);
      });
    </script>

  <body><div id="root"><div id="startup-message"><h1>Emerald Library</h1><p>Starting your digital library…</p></div></div><script type="module" src="/src/main.jsx"></script></body>
